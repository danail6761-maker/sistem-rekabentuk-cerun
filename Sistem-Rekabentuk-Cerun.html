<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Rekabentuk Cerun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Susun atur: bar alat di atas; navigasi modul | borang input | lukisan keratan rentas + ringkasan FOS (melekit). */
:root{
  --bg:#eef2f3; --panel:#ffffff; --sunk:#f6f8f9; --ink:#15212a; --muted:#5a6873; --line:#d3dbe0;
  --accent:#0d5b78; --accent-ink:#ffffff; --accent-soft:#e1eef3; --ochre:#a8661c;
  --ok:#2b7a46; --ok-soft:#e3f2e8; --bad:#b0281f; --bad-soft:#f9e5e3; --warn:#9a6300; --warn-soft:#fbf0dc;
  --water:#2a7fc1; --slip:#c8321f; --nail:#2b7a46; --grid:#e3e9ec;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --panel:#162027; --sunk:#111a20; --ink:#e3eaee; --muted:#93a2ac; --line:#2a3943;
  --accent:#62b5d6; --accent-ink:#06141b; --accent-soft:#16323e; --ochre:#e0a55c;
  --ok:#6cc58b; --ok-soft:#173226; --bad:#f2877c; --bad-soft:#3a1d1b; --warn:#e8b450; --warn-soft:#3a2c12;
  --water:#6db4ea; --slip:#ff7a63; --nail:#6cc58b; --grid:#1e2b33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --panel:#162027; --sunk:#111a20; --ink:#e3eaee; --muted:#93a2ac; --line:#2a3943;
  --accent:#62b5d6; --accent-ink:#06141b; --accent-soft:#16323e; --ochre:#e0a55c;
  --ok:#6cc58b; --ok-soft:#173226; --bad:#f2877c; --bad-soft:#3a1d1b; --warn:#e8b450; --warn-soft:#3a2c12;
  --water:#6db4ea; --slip:#ff7a63; --nail:#6cc58b; --grid:#1e2b33; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:500 13px/1 var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 11px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding-block:16px;align-items:start}
.layout.full{grid-template-columns:200px minmax(0,1fr)}
.layout.full aside.fig{display:none}
nav.mods{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px}
nav.mods a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500}
nav.mods a .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:18px}
nav.mods a:hover{background:var(--sunk)}
nav.mods a.on{background:var(--accent-soft);color:var(--accent)}
nav.mods a.on .n{color:var(--accent)}
nav.mods .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:transparent}
nav.mods .dot.ok{background:var(--ok)} nav.mods .dot.bad{background:var(--bad)} nav.mods .dot.warn{background:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.panel h2{font-family:var(--f-disp);font-weight:600;font-size:26px;letter-spacing:.01em;margin:0 0 2px;text-wrap:balance}
.panel .lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.panel h3{font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
.f label i{font-style:normal;font-family:var(--f-mono);font-size:11.5px}
input,select{font:400 14px var(--f-body);color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[type=color]{padding:2px;height:32px;width:44px}
input[type=checkbox]{width:auto}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:70ch}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;font-size:12px;color:var(--muted);background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.edit input{padding:5px 6px;min-width:64px}
table.edit input.w{min-width:130px}
.rowbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--sunk);color:var(--muted)}
aside.fig{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.card .hd b{font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.card .hd .sp{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.figbox{overflow-x:auto}
.figbox svg{display:block;width:100%;height:auto;min-width:420px}
.fos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fos div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.fos div.prim{border-color:var(--accent)}
.fos small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.fos strong{font-family:var(--f-mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.fos em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:4px}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.status-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.status-list div{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:13px}
.status-list div:last-child{border:0;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kv div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:11.5px}
.kv strong{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.note b{color:var(--warn)}
details{margin-top:12px} summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
#nailRes td,#anaRes td,#ewRes td{white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20}
.busy{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
/* Laporan */
.report{font-size:13.5px}
.report .rh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.report .rh h1{font-family:var(--f-disp);font-size:30px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.02em}
.report h4{font-family:var(--f-disp);font-size:18px;font-weight:600;margin:20px 0 8px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:4px}
.report .sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:24px}
.report .sig div{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--muted);min-height:60px}
.mini{font-size:12px;color:var(--muted)}
@media (max-width:1180px){.layout{grid-template-columns:190px minmax(0,1fr)} aside.fig{grid-column:1 / -1;position:static}}
@media (max-width:760px){
  .layout,.layout.full{grid-template-columns:minmax(0,1fr)}
  nav.mods{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.mods a{white-space:nowrap;flex:none}
  nav.mods .dot{margin-left:4px}
  .fos{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
}
@media print{
  header.top,nav.mods,aside.fig,.noprint,body::before{display:none!important}
  .layout,.layout.full{display:block;padding:0}
  .panel{border:0;padding:0}
  :root{--bg:#fff;--panel:#fff;--sunk:#f4f4f4;--ink:#000;--muted:#444;--line:#bbb}
  .report h4{break-after:avoid} table{break-inside:auto} tr{break-inside:avoid}
  .figbox svg{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>


<header class="top"><div class="wrap">
  <div class="brand"><b>Rekabentuk Cerun</b><span id="projLabel"></span></div>
  <div class="tools">
    <button id="btnNew" type="button" title="Mula projek kosong berdasarkan templat">Projek baharu</button>
    <button id="btnSample" type="button">Muat contoh</button>
    <label class="btn" for="fileOpen">Buka fail .json</label>
    <input id="fileOpen" type="file" accept=".json,application/json" hidden>
    <button id="btnSave" type="button" class="standalone" hidden>Simpan .json</button>
    <button id="btnCopy" type="button">Salin data projek</button>
    <button id="btnPrint" type="button" class="primary standalone" hidden>Cetak laporan</button>
  </div>
</div></header>

<div class="wrap"><div class="layout" id="layout">
  <nav class="mods" id="nav" aria-label="Modul"></nav>
  <main class="panel" id="panel"></main>
  <aside class="fig" id="aside">
    <div class="card">
      <div class="hd"><b>Keratan rentas</b>
        <div class="sp">
          <label class="check"><input type="checkbox" id="optSlices" checked> Hirisan</label>
          <label class="check"><input type="checkbox" id="optTop"> 10 bulatan terendah</label>
          <label class="check"><input type="checkbox" id="optGrid"> Grid pusat</label>
          <label class="check"><input type="checkbox" id="optRein" checked> Dengan paku</label>
        </div>
      </div>
      <div class="figbox" id="fig"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="summary"></div>
  </aside>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   ENJIN KIRAAN REKABENTUK CERUN
   Unit: m, kN, kPa, darjah. Sistem koordinat: x mendatar (kanan +),
   y ketinggian (atas +). Cerun naik ke kanan; jisim gelincir bergerak
   ke kiri (ke arah kaki cerun).
   ===================================================================== */
(function (root) {
  'use strict';
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------------- Geometri ---------------- */
  function buildProfile(g) {
    const pts = [];
    let x = 0, y = +g.toeElev || 0;
    pts.push([-(+g.toeExt || 0), y]);
    pts.push([0, y]);
    const faces = [], berms = [];
    const n = g.benches.length;
    g.benches.forEach((b, i) => {
      const h = +b.h, run = h * (+b.n);
      faces.push({ x1: x, y1: y, x2: x + run, y2: y + h, bench: i + 1 });
      x += run; y += h;
      pts.push([x, y]);
      if (i < n - 1 && +b.berm > 0) {
        berms.push({ x1: x, x2: x + (+b.berm), y, bench: i + 1 });
        x += +b.berm;
        pts.push([x, y]);
      }
    });
    const xCrest = x, yCrest = y;
    pts.push([x + (+g.crestExt || 0), y]);
    return { pts, faces, berms, xToe: 0, yToe: +g.toeElev || 0, xCrest, yCrest,
      H: yCrest - (+g.toeElev || 0), xMin: pts[0][0], xMax: pts[pts.length - 1][0] };
  }

  function interp(pts, x) {
    if (!pts || !pts.length) return NaN;
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      if (x <= pts[i][0]) {
        const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
        if (x2 === x1) return y2;
        return y1 + (y2 - y1) * (x - x1) / (x2 - x1);
      }
    }
    return pts[pts.length - 1][1];
  }

  /* ---------------- Model ---------------- */
  function buildModel(p) {
    const prof = buildProfile(p.geom);
    const soils = p.soils.map(s => ({ ...s, gamma: +s.gamma, gammaSat: +s.gammaSat,
      c: +s.c, phi: +s.phi, bottom: s.bottom === '' || s.bottom == null ? -1e9 : +s.bottom }));
    // susun dari atas ke bawah
    soils.sort((a, b) => b.bottom - a.bottom);
    soils[soils.length - 1].bottom = -1e9;
    const w = p.water || { mode: 'none' };
    const water = { mode: w.mode, ru: +w.ru || 0, gw: +w.gammaW || 9.81,
      pts: (w.points || []).map(q => [+q[0], +q[1]]).sort((a, b) => a[0] - b[0]) };
    const L = p.loads || {};
    const qx1 = prof.xCrest + (+L.qOffset || 0);
    const load = { q: +L.q || 0, x1: qx1, x2: qx1 + (+L.qWidth || 0), kh: +L.kh || 0 };
    return { p, prof, soils, water, load };
  }

  const ySurf = (m, x) => interp(m.prof.pts, x);
  function yWater(m, x) {
    if (m.water.mode !== 'line' || m.water.pts.length < 2) return -1e9;
    return Math.min(interp(m.water.pts, x), ySurf(m, x));
  }
  function soilAt(m, y) {
    for (const s of m.soils) if (y > s.bottom) return s;
    return m.soils[m.soils.length - 1];
  }

  /* berat lajur (per m lebar) antara yb dan yt, beserta pusat graviti */
  function columnWeight(m, x, yb, yt) {
    const yw = yWater(m, x);
    const brk = [yb, yt];
    m.soils.forEach(s => { if (s.bottom > yb && s.bottom < yt) brk.push(s.bottom); });
    if (yw > yb && yw < yt) brk.push(yw);
    brk.sort((a, b) => a - b);
    let w = 0, my = 0;
    for (let i = 1; i < brk.length; i++) {
      const a = brk[i - 1], b = brk[i];
      if (b - a < 1e-9) continue;
      const mid = (a + b) / 2;
      const s = soilAt(m, mid);
      const g = mid < yw ? s.gammaSat : s.gamma;
      const dw = g * (b - a);
      w += dw; my += dw * mid;
    }
    return { w, yg: w > 0 ? my / w : (yb + yt) / 2 };
  }

  /* ---------------- Bulatan gelincir ---------------- */
  function circleY(xc, yc, R, x) {
    const d = R * R - (x - xc) * (x - xc);
    return d < 0 ? NaN : yc - Math.sqrt(d);
  }

  function findArc(m, xc, yc, R) {
    const a = Math.max(m.prof.xMin, xc - R), b = Math.min(m.prof.xMax, xc + R);
    if (b - a < 0.5) return null;
    const N = 240, dx = (b - a) / N;
    const inside = x => { const yy = circleY(xc, yc, R, x); return !isNaN(yy) && yy < ySurf(m, x) - 1e-6; };
    let best = null, start = null;
    for (let i = 0; i <= N; i++) {
      const x = a + i * dx, ins = inside(x);
      if (ins && start === null) start = i;
      if ((!ins || i === N) && start !== null) {
        const end = ins ? i : i - 1;
        if (!best || end - start > best[1] - best[0]) best = [start, end];
        start = null;
      }
    }
    if (!best) return null;
    // tolak jika jisim keluar dari sempadan model
    if ((best[0] === 0 && xc - R < m.prof.xMin) || (best[1] === N && xc + R > m.prof.xMax)) return null;
    const refine = (xin, xout) => { for (let k = 0; k < 30; k++) { const mid = (xin + xout) / 2; if (inside(mid)) xin = mid; else xout = mid; } return (xin + xout) / 2; };
    const xL = best[0] === 0 ? a : refine(a + best[0] * dx, a + (best[0] - 1) * dx);
    const xR = best[1] === N ? b : refine(a + best[1] * dx, a + (best[1] + 1) * dx);
    return { xL, xR };
  }

  function makeSlices(m, xc, yc, R, xL, xR, n) {
    const b = (xR - xL) / n, sl = [];
    let maxDepth = 0;
    for (let i = 0; i < n; i++) {
      const xm = xL + (i + 0.5) * b;
      const yt = ySurf(m, xm), yb = circleY(xc, yc, R, xm);
      const h = yt - yb;
      if (h > maxDepth) maxDepth = h;
      const col = columnWeight(m, xm, yb, Math.max(yt, yb));
      const w = col.w * b, yg = col.yg; // berat hirisan (kN/m)
      // beban surcaj
      let Q = 0;
      if (m.load.q > 0) {
        const ov = Math.max(0, Math.min(xL + (i + 1) * b, m.load.x2) - Math.max(xL + i * b, m.load.x1));
        Q = m.load.q * ov;
      }
      const alpha = Math.asin(clamp((xm - xc) / R, -1, 1));
      const s = soilAt(m, yb + 1e-6);
      let u = 0;
      if (m.water.mode === 'line') u = m.water.gw * Math.max(0, yWater(m, xm) - yb);
      else if (m.water.mode === 'ru') u = m.water.ru * col.w;
      sl.push({ xm, b, yt, yb, h, W: w + Q, Ws: w, Q, yg, alpha, c: s.c, phi: s.phi, soil: s.name, u, rock: !!s.rock });
    }
    return { slices: sl, maxDepth };
  }

  /* sumbangan paku tanah: pulangkan senarai {T (kN/m), alpha, theta, phi} */
  function nailForces(m, xc, yc, R, xL, xR, nails) {
    if (!nails || !nails.rows) return [];
    const out = [];
    nails.rows.forEach(r => {
      if (r.xh < xL || r.xh > xR) return;
      const th = r.theta * D2R, dx = Math.cos(th), dy = -Math.sin(th);
      const fx = r.xh - xc, fy = r.yh - yc;
      const B = 2 * (fx * dx + fy * dy), C = fx * fx + fy * fy - R * R;
      const disc = B * B - 4 * C;
      if (disc < 0 || C > 0) return; // kepala di luar bulatan
      const t = (-B + Math.sqrt(disc)) / 2;
      if (t <= 0 || t >= r.L) return;
      const Le = r.L - t;
      const xi = r.xh + t * dx, yi = r.yh + t * dy;
      const Tp = Math.PI * nails.Dh * nails.qs * Le / nails.FSp;
      const T = Math.min(nails.Tt, Tp) / nails.Sh;
      const alpha = Math.asin(clamp((xi - xc) / R, -1, 1));
      const s = soilAt(m, yi);
      out.push({ T, alpha, theta: th, phi: s.phi, Le, Tp, xi, yi, row: r.row });
    });
    return out;
  }

  function analyseCircle(m, xc, yc, R, opt) {
    const arc = findArc(m, xc, yc, R);
    if (!arc) return null;
    const { slices, maxDepth } = makeSlices(m, xc, yc, R, arc.xL, arc.xR, opt.nSlices || 30);
    if (maxDepth < (opt.minDepth || 0.3)) return null;
    if (slices.some(s => s.rock)) return null;
    const kh = m.load.kh;
    const nf = opt.nails ? nailForces(m, xc, yc, R, arc.xL, arc.xR, opt.nails) : [];
    const nailTerm = F => nf.reduce((acc, n) => acc + n.T * (Math.cos(n.alpha + n.theta) + Math.sin(n.alpha + n.theta) * Math.tan(n.phi * D2R)), 0);

    // momen penggerak (dibahagi R)
    let Dm = 0;
    slices.forEach(s => { Dm += s.W * Math.sin(s.alpha) + kh * s.Ws * (yc - s.yg) / R; });
    if (Dm <= 1e-6) return null;
    const res = { xc, yc, R, xL: arc.xL, xR: arc.xR, maxDepth, slices, nails: nf, FS: {} };

    // Fellenius (Ordinary Method of Slices)
    let Rf = 0;
    slices.forEach(s => {
      const ca = Math.cos(s.alpha), tp = Math.tan(s.phi * D2R);
      const N = Math.max(0, s.W * ca - kh * s.Ws * Math.sin(s.alpha) - s.u * s.b / ca);
      Rf += s.c * s.b / ca + N * tp;
    });
    res.FS.fellenius = (Rf + nailTerm()) / Dm;

    // Bishop Dipermudah
    let F = Math.max(res.FS.fellenius, 0.3);
    for (let it = 0; it < 100; it++) {
      let num = 0;
      slices.forEach(s => {
        const tp = Math.tan(s.phi * D2R);
        const ma = Math.cos(s.alpha) + Math.sin(s.alpha) * tp / F;
        num += (s.c * s.b + Math.max(0, s.W - s.u * s.b) * tp) / Math.max(ma, 0.2);
      });
      const Fn = (num + nailTerm()) / Dm;
      if (Math.abs(Fn - F) < 1e-5) { F = Fn; break; }
      F = Fn;
    }
    res.FS.bishop = F;

    // Janbu Dipermudah (dengan faktor pembetulan f0)
    let Dh = 0;
    slices.forEach(s => { Dh += s.W * Math.tan(s.alpha) + kh * s.Ws; });
    const chord = Math.hypot(arc.xR - arc.xL, ySurf(m, arc.xR) - ySurf(m, arc.xL));
    const yLc = ySurf(m, arc.xL), yRc = ySurf(m, arc.xR);
    let d = 0;
    slices.forEach(s => {
      const yChord = yLc + (yRc - yLc) * (s.xm - arc.xL) / (arc.xR - arc.xL);
      const dist = (yChord - s.yb) * (arc.xR - arc.xL) / chord;
      if (dist > d) d = dist;
    });
    const anyC = slices.some(s => s.c > 0), anyP = slices.some(s => s.phi > 0);
    const b1 = anyC && anyP ? 0.69 : anyP ? 0.50 : 0.31;
    const f0 = 1 + b1 * (d / chord - 1.4 * Math.pow(d / chord, 2));
    if (Dh > 1e-6) {
      let Fj = Math.max(res.FS.bishop, 0.3);
      for (let it = 0; it < 100; it++) {
        let num = 0;
        slices.forEach(s => {
          const tp = Math.tan(s.phi * D2R), ca = Math.cos(s.alpha);
          const ma = ca + Math.sin(s.alpha) * tp / Fj;
          num += (s.c * s.b + Math.max(0, s.W - s.u * s.b) * tp) / Math.max(ca * ma, 0.15);
        });
        num += nf.reduce((acc, n) => acc + n.T * (Math.cos(n.alpha + n.theta) + Math.sin(n.alpha + n.theta) * Math.tan(n.phi * D2R)) / Math.cos(n.alpha), 0);
        const Fn = f0 * num / Dh;
        if (Math.abs(Fn - Fj) < 1e-5) { Fj = Fn; break; }
        Fj = Fn;
      }
      res.FS.janbu = Fj;
      res.f0 = f0;
    } else res.FS.janbu = NaN;
    return res;
  }

  /* ---------------- Carian bulatan kritikal ---------------- */
  function searchGrid(m, s) {
    const P = m.prof, H = Math.max(P.H, 1);
    const W = Math.max(P.xCrest - P.xToe, 1);
    return {
      x1: s.auto ? P.xToe - 0.3 * W : +s.x1, x2: s.auto ? P.xCrest + 0.15 * W : +s.x2,
      y1: s.auto ? P.yCrest + 0.15 * H : +s.y1, y2: s.auto ? P.yCrest + 1.6 * H : +s.y2,
    };
  }

  function search(m, s, nails, primary) {
    primary = primary || 'bishop';
    const g = searchGrid(m, s);
    const nx = Math.max(3, +s.nx || 12), ny = Math.max(3, +s.ny || 12), nr = Math.max(3, +s.nr || 10);
    const P = m.prof, H = Math.max(P.H, 1);
    const yLow = P.yToe - (+s.depthBelow >= 0 ? +s.depthBelow : 0.5 * H);
    const opt = { nSlices: +s.nSlices || 30, minDepth: +s.minDepth || 0.5, nails };
    const best = {}, trials = [];
    let count = 0;
    const consider = r => {
      count++;
      ['fellenius', 'bishop', 'janbu'].forEach(k => {
        const v = r.FS[k];
        if (isFinite(v) && v > 0 && (!best[k] || v < best[k].FS[k])) best[k] = r;
      });
    };
    const centreMin = [];
    const tryCentre = (xc, yc, nR, record) => {
      let cmin = Infinity;
      const yTopTan = P.yCrest - opt.minDepth * 0.5;
      for (let k = 0; k < nR; k++) {
        const yt = yLow + (yTopTan - yLow) * k / (nR - 1);
        const R = yc - yt;
        if (R <= 0.5) continue;
        const r = analyseCircle(m, xc, yc, R, opt);
        if (!r) continue;
        consider(r);
        if (record) trials.push({ xc, yc, R, F: r.FS[primary] });
        if (r.FS[primary] < cmin) cmin = r.FS[primary];
      }
      return cmin;
    };
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
      const xc = g.x1 + (g.x2 - g.x1) * i / (nx - 1);
      const yc = g.y1 + (g.y2 - g.y1) * j / (ny - 1);
      const f = tryCentre(xc, yc, nr, true);
      centreMin.push({ xc, yc, F: f });
    }
    // perhalusan di sekitar pusat terbaik
    let dx = (g.x2 - g.x1) / (nx - 1), dy = (g.y2 - g.y1) / (ny - 1);
    for (let pass = 0; pass < 2 && best[primary]; pass++) {
      const c = best[primary];
      for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) {
        tryCentre(c.xc + i * dx / 3, c.yc + j * dy / 3, nr * 2, false);
      }
      dx /= 3; dy /= 3;
    }
    trials.sort((a, b) => a.F - b.F);
    return { best, grid: g, centreMin, top: trials.slice(0, 12), count };
  }

  /* ---------------- Paku tanah ---------------- */
  function nailLayout(m, nl) {
    if (!nl || !nl.enabled) return null;
    const P = m.prof;
    const rows = [];
    const Sv = Math.max(0.5, +nl.Sv), y0 = P.yCrest - (+nl.firstDepth || Sv / 2);
    let row = 0;
    for (let y = y0; y > P.yToe + 0.3; y -= Sv) {
      const f = P.faces.find(f => y >= f.y1 - 1e-6 && y <= f.y2 + 1e-6);
      if (!f) continue;
      const xh = f.x1 + (f.x2 - f.x1) * (y - f.y1) / (f.y2 - f.y1);
      rows.push({ row: ++row, xh, yh: y, L: +nl.L, theta: +nl.theta, bench: f.bench });
    }
    const dEff = Math.max(0, +nl.barDia - 2 * (+nl.corrosion || 0));
    const As = Math.PI * dEff * dEff / 4; // mm2
    const Tult = (+nl.fy) * As / 1000; // kN
    return { rows, As, Tult, Tt: Tult / (+nl.FSt), Dh: (+nl.holeDia) / 1000, qs: +nl.qs,
      FSp: +nl.FSp, Sh: +nl.Sh, dEff };
  }

  /* ---------------- Cerun tak terhingga ---------------- */
  function infiniteFS(o, z) {
    const b = o.beta * D2R, gw = o.gammaW || 9.81;
    const m = clamp(+o.m, 0, 1);
    const g = (1 - m) * o.gamma + m * o.gammaSat;
    const W = g * z;
    const u = m * z * gw * Math.cos(b) ** 2;
    const N = W * Math.cos(b) ** 2 - u - (o.kh || 0) * W * Math.sin(b) * Math.cos(b);
    const Tq = W * Math.sin(b) * Math.cos(b) + (o.kh || 0) * W * Math.cos(b) ** 2;
    return (o.c + Math.max(0, N) * Math.tan(o.phi * D2R)) / Tq;
  }
  function infiniteAnalysis(o) {
    o = { ...o, beta: +o.beta, z: +o.z, c: +o.c, phi: +o.phi, gamma: +o.gamma, gammaSat: +o.gammaSat, m: +o.m, kh: +o.kh || 0 };
    const FS = infiniteFS(o, o.z);
    const curve = [];
    const zMax = Math.max(o.z * 2, 3);
    for (let i = 1; i <= 40; i++) { const z = zMax * i / 40; curve.push([z, infiniteFS(o, z)]); }
    // sudut cerun maksimum bagi FOS sasaran (pembahagian dua)
    let lo = 1, hi = 89, betaMax = null;
    const target = +o.target || 1.4;
    if (infiniteFS({ ...o, beta: lo }, o.z) >= target) {
      for (let k = 0; k < 50; k++) { const mid = (lo + hi) / 2; if (infiniteFS({ ...o, beta: mid }, o.z) >= target) lo = mid; else hi = mid; }
      betaMax = lo;
    }
    return { FS, curve, betaMax, target };
  }

  /* ---------------- Kerja tanah ---------------- */
  function earthworks(m, e, nl) {
    const P = m.prof;
    const ex = (e.existing || []).map(q => [+q[0], +q[1]]).sort((a, b) => a[0] - b[0]);
    let cut = 0, fill = 0;
    if (ex.length >= 2) {
      const a = Math.max(ex[0][0], P.xMin), b = Math.min(ex[ex.length - 1][0], P.xMax);
      const N = 2000, dx = (b - a) / N;
      for (let i = 0; i < N; i++) {
        const x = a + (i + 0.5) * dx, d = interp(ex, x) - ySurf(m, x);
        if (d > 0) cut += d * dx; else fill -= d * dx;
      }
    }
    const Lr = +e.length || 0;
    let faceLen = 0;
    P.faces.forEach(f => { faceLen += Math.hypot(f.x2 - f.x1, f.y2 - f.y1); });
    const bermW = P.berms.reduce((a, b) => a + (b.x2 - b.x1), 0);
    const q = {
      cutArea: cut, fillArea: fill, cutVol: cut * Lr, fillVol: fill * Lr,
      fillVolLoose: fill * Lr * (+e.fillFactor || 1),
      faceLen, faceArea: faceLen * Lr, bermArea: bermW * Lr,
      bermDrain: P.berms.length * Lr, crestDrain: Lr, toeDrain: Lr,
    };
    if (nl && nl.rows) {
      const perRow = Math.floor(Lr / nl.Sh) + 1;
      q.nailCount = perRow * nl.rows.length;
      q.nailLength = q.nailCount * (nl.rows[0] ? nl.rows[0].L : 0);
    }
    return q;
  }

  /* ---------------- Semakan geometri (amalan lazim) ---------------- */
  function geometryChecks(m, rules) {
    const out = [];
    m.p.geom.benches.forEach((b, i) => {
      const ang = Math.atan(1 / (+b.n)) / D2R;
      out.push({ item: `Tingkat ${i + 1}: tinggi ${(+b.h).toFixed(1)} m`, ok: +b.h <= +rules.maxBench, rule: `≤ ${rules.maxBench} m` });
      out.push({ item: `Tingkat ${i + 1}: kecerunan 1V:${(+b.n).toFixed(2)}H (${ang.toFixed(1)}°)`, ok: +b.n >= +rules.minN - 1e-9, rule: `≥ 1V:${rules.minN}H` });
      if (i < m.p.geom.benches.length - 1) out.push({ item: `Berm ${i + 1}: lebar ${(+b.berm).toFixed(1)} m`, ok: +b.berm >= +rules.minBerm, rule: `≥ ${rules.minBerm} m` });
    });
    return out;
  }

  function requiredFS(c) {
    const t = c.table;
    return Math.max(+t.life[c.life], +t.econ[c.econ]);
  }

  function runAll(p) {
    const m = buildModel(p);
    const nl = nailLayout(m, p.nails);
    const primary = p.methods.primary || 'bishop';
    const unrein = search(m, p.search, null, primary);
    let rein = null;
    if (nl && nl.rows.length) rein = search(m, p.search, nl, primary);
    // semakan paku di permukaan kritikal (tanpa paku)
    let nailCheck = null;
    if (nl && unrein.best[primary]) {
      const c = unrein.best[primary];
      const hit = nailForces(m, c.xc, c.yc, c.R, c.xL, c.xR, nl);
      nailCheck = nl.rows.map(r => {
        const h = hit.find(z => z.row === r.row);
        return { ...r, Le: h ? h.Le : null, Tp: h ? h.Tp : null, Tt: nl.Tt,
          Td: h ? Math.min(nl.Tt, h.Tp) : null };
      });
    }
    const inf = infiniteAnalysis(p.infinite);
    const ew = earthworks(m, p.earth, nl);
    const geo = geometryChecks(m, p.rules);
    const req = requiredFS(p.criteria);
    return { m, nl, unrein, rein, nailCheck, inf, ew, geo, req, primary };
  }

  const API = { buildProfile, buildModel, interp, ySurf, yWater, soilAt, analyseCircle, search,
    nailLayout, nailForces, infiniteAnalysis, infiniteFS, earthworks, geometryChecks, requiredFS, runAll, findArc };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.SlopeEngine = API;
})(this);

</script>

const f = (v, d=2) => (v==null || !isFinite(v)) ? '—' : (+v).toFixed(d);
const METH = { bishop:'Bishop Dipermudah', fellenius:'Fellenius (OMS)', janbu:'Janbu Dipermudah' };

  ['projek','Maklumat projek'], ['geometri','Geometri cerun'], ['tanah','Lapisan tanah'], ['air','Air bumi & beban'],
  ['analisis','Analisis bulatan'], ['paku','Paku tanah'], ['tak-terhingga','Cerun tak terhingga'], ['kerja-tanah','Kerja tanah & kuantiti'],

function navStatus(id){

  if (id === 'paku') { if (!P.nails.enabled) return ''; const b = R.rein && R.rein.best[R.primary]; return !b ? 'warn' : b.FS[R.primary] >= reqFS() ? 'ok' : 'bad'; }
  if (id === 'tak-terhingga') return R.inf.FS >= +P.infinite.target ? 'ok' : 'bad';
  if (id === 'geometri') return R.geo.every(g => g.ok) ? 'ok' : 'warn';

}
function renderNav(){

}

/* ---------- Panel ---------- */

  </div>

/* ---------- Pengiraan ---------- */
const reqFS = () => (+P.loads.kh > 0 ? Math.max(+P.criteria.seismic, 0) : E.requiredFS(P.criteria));
let timer = null;
function schedule(){ clearTimeout(timer); timer = setTimeout(compute, 250); }
function compute(){
  try { R = E.runAll(P); } catch(e){ console.error(e); R = null; }
  try { localStorage.setItem(STORE, JSON.stringify(P)); } catch(e){}
  renderNav();
  updateOutputs();
}

/* ---------- Lukisan keratan rentas ---------- */
function drawSection(opts={}){
  if (!R) return '<p class="mini">Tiada keputusan.</p>';
  const m = R.m, pr = m.prof, H = Math.max(pr.H, 1);
  const useRein = opts.rein ?? (VIEW.rein && R.rein);
  const S = useRein && R.rein ? R.rein : R.unrein;
  const crit = S.best[R.primary];
  const ex = P.earth.existing.map(q=>[+q[0],+q[1]]);
  let x0 = pr.xMin, x1 = pr.xMax;
  let y0 = pr.yToe - Math.max(+P.search.depthBelow || 0, 0.25*H) - 1;
  let y1 = Math.max(pr.yCrest, ...ex.map(q=>q[1])) + 0.25*H;
  if (opts.showCentre !== false && crit) y1 = Math.max(y1, Math.min(crit.yc + 1, pr.yCrest + 2.2*H));
  if (VIEW.grid && !opts.report) y1 = Math.max(y1, S.grid.y2 + 1);
  const Wpx = 900, pad = 34, k = (Wpx - 2*pad) / (x1 - x0);
  const Hpx = Math.round((y1 - y0) * k + 2*pad);
  const X = x => (pad + (x - x0) * k).toFixed(1), Y = y => (pad + (y1 - y) * k).toFixed(1);
  let s = `<svg viewBox="0 0 ${Wpx} ${Hpx}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Keratan rentas cerun" font-family="IBM Plex Mono, monospace" font-size="11">`;
  // grid & paksi
  const step = niceStep((x1-x0)/10);
  s += `<g stroke="var(--grid)" stroke-width="1">`;
  for (let gx = Math.ceil(x0/step)*step; gx <= x1; gx += step) s += `<line x1="${X(gx)}" y1="${pad}" x2="${X(gx)}" y2="${Hpx-pad}"/>`;
  for (let gy = Math.ceil(y0/step)*step; gy <= y1; gy += step) s += `<line x1="${pad}" y1="${Y(gy)}" x2="${Wpx-pad}" y2="${Y(gy)}"/>`;
  s += `</g><g fill="var(--muted)">`;
  for (let gx = Math.ceil(x0/step)*step; gx <= x1; gx += step) s += `<text x="${X(gx)}" y="${Hpx-pad+14}" text-anchor="middle">${+gx.toFixed(1)}</text>`;
  for (let gy = Math.ceil(y0/step)*step; gy <= y1; gy += step) s += `<text x="${pad-5}" y="${(+Y(gy)+4)}" text-anchor="end">${+gy.toFixed(1)}</text>`;
  s += `</g>`;
  // lapisan tanah (dipotong oleh permukaan)
  const ground = pr.pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');
  const clipId = 'gclip' + (opts.report ? 'r' : 'm');
  s += `<defs><clipPath id="${clipId}"><polygon points="${ground} ${X(x1)},${Y(y0)} ${X(x0)},${Y(y0)}"/></clipPath></defs><g clip-path="url(#${clipId})">`;
  let top = y1;
  m.soils.forEach(so => {
    const bot = Math.max(so.bottom, y0);
    s += `<rect x="${X(x0)}" y="${Y(top)}" width="${(x1-x0)*k}" height="${Math.max(0,(top-bot)*k)}" fill="${esc(so.color||'#aaa')}" fill-opacity="0.55"/>`;
    if (so.rock) s += `<rect x="${X(x0)}" y="${Y(top)}" width="${(x1-x0)*k}" height="${Math.max(0,(top-bot)*k)}" fill="url(#hatch)" />`;
    top = bot;
  });
  s += `</g><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--ink)" stroke-opacity=".35" stroke-width="1"/></pattern></defs>`;
  // tanah asal
  if (ex.length > 1) s += `<polyline points="${ex.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="var(--ochre)" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  // permukaan rekabentuk
  s += `<polyline points="${ground}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>`;
  // air bumi
  if (m.water.mode === 'line' && m.water.pts.length > 1) {
    const wp = []; for (let i=0;i<=120;i++){ const x = x0 + (x1-x0)*i/120; wp.push(`${X(x)},${Y(E.yWater(m,x))}`); }
    s += `<polyline points="${wp.join(' ')}" fill="none" stroke="var(--water)" stroke-width="1.8" stroke-dasharray="10 3 2 3"/>`;
    const xw = x0 + (x1-x0)*0.06, yw = E.yWater(m, xw);
    s += `<path d="M${X(xw)-6},${+Y(yw)-9} h12 l-6,8 z" fill="var(--water)"/>`;
  }
  // surcaj
  if (m.load.q > 0 && m.load.x2 > m.load.x1) {
    const yq = E.ySurf(m, m.load.x1);
    s += `<rect x="${X(m.load.x1)}" y="${+Y(yq)-14}" width="${(m.load.x2-m.load.x1)*k}" height="4" fill="var(--ochre)"/>`;
    for (let xa = m.load.x1; xa <= m.load.x2 + 1e-6; xa += Math.max((m.load.x2-m.load.x1)/5, 0.5)) s += `<line x1="${X(xa)}" y1="${+Y(yq)-10}" x2="${X(xa)}" y2="${+Y(yq)-2}" stroke="var(--ochre)" stroke-width="1.4"/>`;
    s += `<text x="${X((m.load.x1+m.load.x2)/2)}" y="${+Y(yq)-18}" text-anchor="middle" fill="var(--ochre)">q = ${f(m.load.q,0)} kPa</text>`;
  }
  // label tingkat
  pr.faces.forEach(fc => {
    const xm = (fc.x1+fc.x2)/2, ym = (fc.y1+fc.y2)/2;
    s += `<text x="${+X(xm)+8}" y="${+Y(ym)+14}" fill="var(--muted)" font-size="10.5">1:${f((fc.x2-fc.x1)/(fc.y2-fc.y1),1)}</text>`;
  });
  // grid pusat
  if (VIEW.grid && !opts.report) {
    const fin = S.centreMin.filter(c=>isFinite(c.F)); const lo = Math.min(...fin.map(c=>c.F)), hi = Math.max(...fin.map(c=>c.F));
    S.centreMin.forEach(c => { if (!isFinite(c.F)) return; const t = hi>lo ? (c.F-lo)/(hi-lo) : 0; s += `<circle cx="${X(c.xc)}" cy="${Y(c.yc)}" r="3" fill="var(--slip)" fill-opacity="${(1-t)*0.85+0.1}"/>`; });
  }
  // bulatan terendah
  if (VIEW.top && !opts.report) S.top.slice(0,10).forEach(c => { const r = E.findArc(m, c.xc, c.yc, c.R); if (r) s += arc(c.xc,c.yc,c.R,r.xL,r.xR,X,Y,k,'var(--muted)',1,0.6); });
  // bulatan kritikal
  if (crit) {
    if (VIEW.slices || opts.report) crit.slices.forEach((sl,i) => { if (i===0) return; const xa = sl.xm - sl.b/2; s += `<line x1="${X(xa)}" y1="${Y(E.ySurf(m,xa))}" x2="${X(xa)}" y2="${Y(crit.yc - Math.sqrt(Math.max(0,crit.R**2-(xa-crit.xc)**2)))}" stroke="var(--slip)" stroke-opacity=".45" stroke-width="0.8"/>`; });
    s += arc(crit.xc,crit.yc,crit.R,crit.xL,crit.xR,X,Y,k,'var(--slip)',2.4,1);
    if (opts.showCentre !== false) {
      s += `<line x1="${X(crit.xc)}" y1="${Y(crit.yc)}" x2="${X(crit.xL)}" y2="${Y(E.ySurf(m,crit.xL))}" stroke="var(--slip)" stroke-dasharray="3 3" stroke-width="0.9"/>`;
      s += `<line x1="${X(crit.xc)}" y1="${Y(crit.yc)}" x2="${X(crit.xR)}" y2="${Y(E.ySurf(m,crit.xR))}" stroke="var(--slip)" stroke-dasharray="3 3" stroke-width="0.9"/>`;
      s += `<circle cx="${X(crit.xc)}" cy="${Y(crit.yc)}" r="4" fill="var(--slip)"/>`;
      s += `<text x="${+X(crit.xc)+8}" y="${+Y(crit.yc)-6}" fill="var(--slip)" font-size="13" font-weight="600">FOS ${f(crit.FS[R.primary],3)}</text>`;
    }
  }
  // paku
  if (R.nl && (useRein || opts.report)) R.nl.rows.forEach(r => {
    const th = r.theta*Math.PI/180;
    s += `<line x1="${X(r.xh)}" y1="${Y(r.yh)}" x2="${X(r.xh + r.L*Math.cos(th))}" y2="${Y(r.yh - r.L*Math.sin(th))}" stroke="var(--nail)" stroke-width="2"/>`;
    s += `<circle cx="${X(r.xh)}" cy="${Y(r.yh)}" r="2.6" fill="var(--nail)"/>`;
  });
  s += `</svg>`;
  return s;
}
function arc(xc,yc,R,xL,xR,X,Y,k,col,w,op){
  const pts = []; const n = 60;
  for (let i=0;i<=n;i++){ const x = xL + (xR-xL)*i/n; pts.push(`${X(x)},${Y(yc - Math.sqrt(Math.max(0,R*R-(x-xc)**2)))}`); }
  return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-opacity="${op}"/>`;
}
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw))); const r = raw/p; return (r<1.5?1:r<3.5?2:r<7.5?5:10)*p; }

function legendHTML(){

/* ---------- Ringkasan ---------- */
function pass(v, req){ return !isFinite(v) ? '<span class="pill na">Tiada</span>' : v >= req ? '<span class="pill ok">Lulus</span>' : '<span class="pill bad">Gagal</span>'; }
function fosGrid(S){
  return `<div class="fos">${['bishop','fellenius','janbu'].map(k => { const b = S && S.best[k]; return `<div class="${k===R.primary?'prim':''}"><small>${METH[k]}</small><strong>${b?f(b.FS[k],3):'—'}</strong></div>`; }).join('')}</div>`;
}
function summaryHTML(){
  if (!R) return '<p>Ralat pengiraan. Semak input.</p>';
  const req = reqFS(), b0 = R.unrein.best[R.primary], b1 = R.rein && R.rein.best[R.primary];
  const final = b1 || b0, Ff = final ? final.FS[R.primary] : NaN;
  const allOk = Ff >= req && R.inf.FS >= +P.infinite.target;

    <div class="status-list" style="margin-top:12px">

      <div><span>Kestabilan menyeluruh (${METH[R.primary]})</span>${pass(Ff, req)}</div>
      <div><span>Kegagalan cetek (cerun tak terhingga)</span>${pass(R.inf.FS, +P.infinite.target)}</div>
      <div><span>Semakan geometri</span>${R.geo.every(g=>g.ok)?'<span class="pill ok">Patuh</span>':`<span class="pill warn">${R.geo.filter(g=>!g.ok).length} isu</span>`}</div>

function critTable(S, req){

  ${['bishop','fellenius','janbu'].map(k=>{ const b = S.best[k]; return b ? `<tr><td>${METH[k]}${k===R.primary?' <span class="pill na">utama</span>':''}</td><td class="num"><b>${f(b.FS[k],3)}</b></td><td class="num">${f(b.xc)}</td><td class="num">${f(b.yc)}</td><td class="num">${f(b.R)}</td><td class="num">${f(b.maxDepth)} m</td><td>${pass(b.FS[k],req)}</td></tr>` : `<tr><td>${METH[k]}</td><td colspan="6">Tiada bulatan sah ditemui</td></tr>`; }).join('')}

function anaHTML(req){
  const S = R.unrein, b = S.best[R.primary];

  const g = S.grid, edge = Math.abs(b.xc-g.x1)<1e-6||Math.abs(b.xc-g.x2)<1e-6||Math.abs(b.yc-g.y1)<1e-6||Math.abs(b.yc-g.y2)<1e-6;
  return `${critTable(S, req)}
  ${edge?'<div class="note"><b>Pusat kritikal di tepi grid.</b> FOS sebenar mungkin lebih rendah. Besarkan julat grid.</div>':''}
  ${b.FS[R.primary] < req ? `<div class="note"><b>Tidak memenuhi FOS ${f(req,2)}.</b> Pertimbangkan cerun lebih landai, berm lebih lebar, sistem saliran untuk menurunkan air bumi, atau paku tanah (modul 06).</div>` : ''}

function infHTML(){
  const I = R.inf, o = P.infinite;
  const W = 640, Hh = 260, pl = 46, pb = 34, pt = 14, pr = 14;
  const zMax = I.curve[I.curve.length-1][0];
  const fMax = Math.max(+o.target*1.5, Math.min(Math.max(...I.curve.map(c=>c[1]).filter(isFinite)), +o.target*3));
  const X = z => pl + (z/zMax)*(W-pl-pr), Y = v => pt + (1 - Math.min(v,fMax)/fMax)*(Hh-pt-pb);
  let svg = `<svg viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace" font-size="11" role="img" aria-label="Graf FOS lawan kedalaman">`;
  const ys = niceStep(fMax/5), xs = niceStep(zMax/6);
  for (let v=0; v<=fMax+1e-9; v+=ys) svg += `<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" fill="var(--muted)">${+v.toFixed(2)}</text>`;
  for (let z=0; z<=zMax+1e-9; z+=xs) svg += `<text x="${X(z)}" y="${Hh-pb+16}" text-anchor="middle" fill="var(--muted)">${+z.toFixed(1)}</text>`;
  svg += `<text x="${(pl+W-pr)/2}" y="${Hh-4}" text-anchor="middle" fill="var(--muted)">Kedalaman z (m)</text>`;
  svg += `<line x1="${pl}" x2="${W-pr}" y1="${Y(+o.target)}" y2="${Y(+o.target)}" stroke="var(--ochre)" stroke-dasharray="6 4"/><text x="${W-pr-4}" y="${Y(+o.target)-5}" text-anchor="end" fill="var(--ochre)">sasaran ${f(o.target,2)}</text>`;
  const pts = I.curve.map(c=>`${X(c[0]).toFixed(1)},${Y(c[1]).toFixed(1)}`);
  svg += `<polygon points="${X(I.curve[0][0]).toFixed(1)},${Y(0)} ${pts.join(' ')} ${X(zMax)},${Y(0)}" fill="var(--accent)" fill-opacity=".1"/>`;
  svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  svg += `<circle cx="${X(+o.z)}" cy="${Y(I.FS)}" r="5" fill="var(--slip)"/><text x="${X(+o.z)+8}" y="${Y(I.FS)-8}" fill="var(--slip)" font-weight="600">FOS ${f(I.FS,3)} @ z = ${f(o.z,2)} m</text></svg>`;
  return `<div class="kv"><div><small>FOS pada z = ${f(o.z,2)} m</small><strong>${f(I.FS,3)}</strong></div>
    <div><small>Sudut maksimum untuk FOS ${f(I.target,2)}</small><strong>${I.betaMax==null?'—':f(I.betaMax,1)+'°'}</strong></div>
    <div><small>Setara kecerunan</small><strong>${I.betaMax==null?'—':'1V:'+f(1/Math.tan(I.betaMax*Math.PI/180),2)+'H'}</strong></div>
    <div><small>Status</small><strong style="font-size:14px">${pass(I.FS, +o.target)}</strong></div></div>
    <div class="figbox" style="margin-top:12px">${svg}</div>`;
}

    ${critTable(R.unrein, req)}
    ${R.rein?`<h4>6. Analisis dengan paku tanah</h4>
    <p class="mini">${R.nl.rows.length} baris; L = ${f(P.nails.L,1)} m; θ = ${f(P.nails.theta,0)}°; Sh × Sv = ${f(P.nails.Sh,2)} × ${f(P.nails.Sv,2)} m; bar Ø${f(P.nails.barDia,0)} mm (fy ${f(P.nails.fy,0)} MPa, elaun karat ${f(P.nails.corrosion,1)} mm); lubang Ø${f(P.nails.holeDia,0)} mm; qs = ${f(P.nails.qs,0)} kPa; FOS tegangan ${f(P.nails.FSt,2)}, cabut keluar ${f(P.nails.FSp,2)}.</p>
    ${critTable(R.rein, req)}`:''}
    <h4>${R.rein?'7':'6'}. Kegagalan cetek (cerun tak terhingga)</h4>
    <p>β = ${f(P.infinite.beta,1)}°, z = ${f(P.infinite.z,2)} m, c′ = ${f(P.infinite.c,1)} kPa, φ′ = ${f(P.infinite.phi,1)}°, m = ${f(P.infinite.m,2)} → <b>FOS = ${f(R.inf.FS,3)}</b> ${pass(R.inf.FS, +P.infinite.target)} (sasaran ${f(P.infinite.target,2)}).</p>
    <h4>${R.rein?'8':'7'}. Kuantiti anggaran</h4>
    ${ewHTML()}
    <h4>Kenyataan</h4>
    <p class="mini">Analisis keseimbangan had 2D untuk permukaan gelinciran bulatan. Keputusan bergantung pada ketepatan parameter tanah dan paras air bumi. Rekabentuk ini mesti disemak dan disahkan oleh Jurutera Profesional berdaftar dengan BEM sebelum digunakan untuk pembinaan. Permukaan bukan bulatan, kegagalan baji batuan dan aliran rembesan terperinci memerlukan analisis berasingan.</p>
    <div class="sig"><div>Disediakan oleh<br><b style="color:var(--ink)">${esc(I.engineer)}</b></div><div>Disemak oleh<br><b style="color:var(--ink)">${esc(I.checker)}</b></div><div>Diluluskan oleh</div></div>`;
}

/* ---------- Peristiwa ---------- */
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  let v;
  if (e.target.type === 'checkbox') v = e.target.checked;
  else if (e.target.type === 'number') v = e.target.value === '' ? '' : parseFloat(e.target.value);
  else v = e.target.value;
  set(k, v);
  schedule();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (k && (k === 'nails.enabled' || k === 'water.mode')) schedule();
});
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.m) { e.preventDefault(); go(t.dataset.m); return; }
  if (t.dataset.del) {
    const arr = get(t.dataset.del); const min = t.dataset.del === 'water.points' || t.dataset.del === 'earth.existing' ? 2 : 1;
    if (arr.length <= min) { toast('Perlu sekurang-kurangnya ' + min + ' baris.'); return; }
    arr.splice(+t.dataset.i, 1); renderPanel(); schedule(); return;
  }
  if (t.dataset.add) {
    const a = t.dataset.add;
    if (a === 'bench') { const L = P.geom.benches; const last = L[L.length-1]; if (L.length) L[L.length-1].berm = L[L.length-1].berm || +P.rules.minBerm; L.push({h:last?last.h:6, n:last?last.n:1.5, berm:0}); }
    if (a === 'soil') { const L = P.soils; const lb = L.length>1 ? +L[L.length-2].bottom : 5; L.splice(L.length-1, 0, {name:'Lapisan baharu', gamma:19, gammaSat:20, c:5, phi:30, bottom: lb - 3, color:'#b8946a', rock:false}); }
    if (a === 'wpt') { const L = P.water.points; const l = L[L.length-1]; L.push([l?+l[0]+5:0, l?+l[1]:0]); }
    if (a === 'ept') { const L = P.earth.existing; const l = L[L.length-1]; L.push([l?+l[0]+5:0, l?+l[1]:0]); }
    renderPanel(); schedule(); return;
  }
  const act = t.dataset.act;
  if (act === 'print') { window.print(); }
  if (act === 'copySlices') { const b = R.unrein.best[R.primary]; const csv = ['no,x,b,h,alpha_deg,W_kN,u_kPa,c,phi,soil'].concat(b.slices.map((s,i)=>[i+1,s.xm.toFixed(3),s.b.toFixed(3),s.h.toFixed(3),(s.alpha*180/Math.PI).toFixed(2),s.W.toFixed(2),s.u.toFixed(2),s.c,s.phi,'"'+s.soil+'"'].join(','))).join('\n'); copy(csv, 'Jadual hirisan disalin.'); }
  if (act === 'infFromGeom') {
    const b = P.geom.benches.reduce((a,c)=> (+c.n < +a.n ? c : a), P.geom.benches[0]);
    const s0 = R.m.soils[0];
    Object.assign(P.infinite, { beta: +(Math.atan(1/b.n)*180/Math.PI).toFixed(1), c:s0.c, phi:s0.phi, gamma:s0.gamma, gammaSat:s0.gammaSat });
    renderPanel(); schedule(); toast('Sudut tingkat paling curam dan lapisan atas digunakan.');
  }
});
['optSlices','optTop','optGrid','optRein'].forEach(id => $('#'+id).addEventListener('change', e => {
  VIEW[{optSlices:'slices',optTop:'top',optGrid:'grid',optRein:'rein'}[id]] = e.target.checked; updateOutputs();
}));
$('#btnNew').onclick = () => { P = blank(); renderPanel(); compute(); toast('Projek baharu dimulakan (geometri templat).'); };
$('#btnSample').onclick = () => { P = sample(); renderPanel(); compute(); toast('Data contoh dimuatkan.'); };
$('#btnCopy').onclick = () => copy(JSON.stringify(P, null, 2), 'Data projek disalin. Tampal ke fail .json untuk simpan.');
$('#fileOpen').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { try { P = Object.assign(sample(), JSON.parse(rd.result)); renderPanel(); compute(); toast('Projek dibuka: ' + (P.info.name||file.name)); } catch(err){ toast('Fail tidak sah. Pilih fail .json yang disimpan oleh sistem ini.'); } };
  rd.readAsText(file); e.target.value = '';
};
if (standalone) {
  document.querySelectorAll('.standalone').forEach(b => b.hidden = false);
  $('#btnSave').onclick = () => {
    const blob = new Blob([JSON.stringify(P, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (P.info.ref || P.info.name || 'projek-cerun').replace(/[^\w\-]+/g,'_') + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#btnPrint').onclick = () => { go('laporan'); setTimeout(() => window.print(), 300); };
}
function copy(text, msg){
  const done = () => toast(msg);
  try { navigator.clipboard.writeText(text).then(done, () => fallback()); } catch(e){ fallback(); }
  function fallback(){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('Salin gagal. Pilih teks secara manual.'); } ta.remove(); }
}
let tt; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(()=>t.hidden=true, 2600); }
function go(id){ cur = id; if (location.hash !== '#'+id) location.hash = id; renderPanel(); window.scrollTo({top:0}); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (MODS.some(m=>m[0]===h) && h !== cur) { cur = h; renderPanel(); } });

renderPanel();
compute();
})();
</script>
